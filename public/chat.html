<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Conversar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;display=block">
</head>
<body class="chat-page bg-dark text-light">
  <!-- BARRA DE NAVEGAÇÃO / MENU SUPERIOR -->
  <nav class="navbar navbar-expand navbar-dark bg-dark border-bottom border-secondary px-3 px-md-4">
    <div class="container-fluid p-0">
      <a class="navbar-brand d-flex align-items-center gap-2" href="chat.html">
  <img
    class="marca-logo" src="/img/logo-chat-conversar.png" alt="Chat Conversar">
</a>

      <div class="d-flex align-items-center gap-2">
        <a href="chat.html" class="btn btn-outline-secondary btn-sm active">💬 Chat</a>
        <a href="relatorio.html" class="btn btn-primary btn-sm">📊 Relatório</a>
        <button id="btn-sair" class="btn btn-outline-danger btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="chat-layout d-flex">
    <!-- Barra lateral de conversas -->
    <aside class="sidebar d-flex flex-column p-3 p-md-4 border-end border-secondary">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Contatos</h1>
      </div>
      <div class="small text-secondary mb-3">
        Conectado como: <strong id="nome-usuario-logado" class="text-light"></strong>
      </div>
      <button id="btn-adicionar-pessoas" type="button" class="btn btn-primary mb-2">Adicionar pessoas</button>
      <ul id="lista-chats" class="list-unstyled overflow-auto flex-grow-1 mb-0">
        <!-- Renderizado dinamicamente via chat.js -->
      </ul>
    </aside>

    <!-- Área principal de conversa -->
    <section class="conversa d-flex flex-column flex-grow-1 p-3 p-md-4">
      <header class="d-flex align-items-center justify-content-between gap-2 mb-3 pb-2 border-bottom border-secondary">
        <h2 id="titulo-chat" class="h4 mb-0">Selecione um contato</h2>
      </header>

      <p id="alerta-conexao" class="text-warning text-center small mb-2" role="status" style="display: none;">
        Sem conexão com o servidor.
      </p>
      <p id="msg-erro" class="text-warning small mb-2" role="alert" style="display: none;"></p>

      <!-- Painel de mensagens -->
      <div id="painel-mensagens" class="flex-grow-1 overflow-auto mb-3 px-2" role="log">
        <!-- Renderizado dinamicamente via chat.js -->
      </div>

      <!-- Formulário de envio -->
      <form id="form-mensagem" class="d-flex">
        <label for="input-mensagem" class="visually-hidden">Mensagem</label>
        <input
          id="input-mensagem"
          class="form-control me-2 rounded-pill bg-dark text-light border-secondary"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
          required
        >
        <button id="btn-enviar" type="submit" class="btn btn-primary rounded-pill px-4">
          Enviar
        </button>
      </form>
    </section>
  </main>

  <dialog id="dialog-pessoas" aria-labelledby="titulo-pessoas">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
      <h2 id="titulo-pessoas" class="h4 mb-0">Adicionar pessoas</h2>
      <button id="btn-fechar-pessoas" type="button" class="btn btn-outline-light">Fechar</button>
    </div>
    <p>Encontre pessoas cadastradas, mesmo quando estiverem offline.</p>
    <label for="busca-pessoas" class="form-label">Buscar por nome ou ID</label>
    <input id="busca-pessoas" type="search" class="form-control mb-3" autocomplete="off">
    <p id="status-contato" role="status" class="text-info"></p>
    <ul id="resultado-pessoas" class="list-unstyled mb-0"></ul>
  </dialog>

  <script src="/js/contas.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
