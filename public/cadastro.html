<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="bg-black">
  <main class="d-flex justify-content-center align-items-center vh-100 px-3">
    <form id="form-cadastro" class="login-card rounded-4 p-4 w-100">
      <h1 class="h2 text-center mb-4 fw-bold">Criar conta</h1>

      <p class="small text-secondary">Demonstração acadêmica. Use um nome e uma senha fictícios.</p>

      <div class="mb-3">
        <label for="username" class="form-label">Nome de usuário</label>
        <input id="username" class="form-control" autocomplete="username" required maxlength="40">
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" class="form-control" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="requisito-senha">
        <div id="requisito-senha" class="form-text text-secondary">Use pelo menos 8 caracteres na senha.</div>
      </div>

      <p id="msg-erro" class="text-warning" role="alert" style="display: none;"></p>

      <button type="submit" class="btn btn-primary w-100">Cadastrar</button>

      <a class="d-block text-center link-light mt-3" href="/login.html">
        Já tenho conta
      </a>
    </form>
  </main>

  <script src="/js/contas.js"></script>
  <script src="/js/cadastro.js"></script>
</body>
</html>
