<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar no Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100 bg-black">
        <div class="rounded-4 p-5 w-100"
             style="max-width: 400px; background-color: #1a1a2e; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);">
            <h2 class="text-center mb-4 fw-bold" style="color: #ccc; letter-spacing: 1px;">
                Entrar no Chat
            </h2>

            <div class="form-group mb-4">
                <input
                    type="text"
                    class="form-control form-control-lg"
                    style="background-color: #12121d; border: 1px solid #333; color: #ccc; border-radius: 8px; outline: none;"
                    id="username"
                    placeholder="Digite seu nome"
                >
            </div>

            <button
                id="btn-entrar"
                class="btn w-100 btn-lg"
                style="background-color: #3a3aff; border: none; color: #ddd; border-radius: 8px; transition: background-color 0.2s ease;"
            >
                Entrar
            </button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
