<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Conversar - Relatório</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="bg-dark text-light">
  <!-- BARRA DE NAVEGAÇÃO SUPERIOR PADRONIZADA -->
  <nav class="navbar navbar-expand navbar-dark bg-dark border-bottom border-secondary px-3 px-md-4">
    <div class="container-fluid p-0">
      <a class="navbar-brand d-flex align-items-center gap-2" href="chat.html">
  <img
    class="marca-logo" src="/img/logo-chat-conversar.png"  alt="Chat Conversar" >
</a>

      <div class="d-flex align-items-center gap-2">
        <a href="chat.html" class="btn btn-outline-secondary btn-sm">💬 Chat</a>
        <a href="relatorio.html" class="btn btn-primary btn-sm">📊 Relatório</a>
        <a href="#" onclick="fazerLogoutELogin(event)" class="btn btn-outline-light btn-sm">🔑 Login</a>
        <a href="cadastro.html" class="btn btn-outline-light btn-sm">📝 Cadastro</a>
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL DO RELATÓRIO -->
  <main class="relatorio-container">
    <div class="relatorio-header">
      <h2>📊 Relatório de Dados (LocalStorage)</h2>
      <p>Informações guardadas na memória local do navegador.</p>
    </div>

    <!-- CARDS DE STATS (INCLUINDO USUÁRIOS CADASTRADOS) -->
    <div class="stats-grid">
      <div class="stat-card">
        <small>Usuário Conectado</small>
        <strong id="relatorio-usuario" class="texto-destaque">-</strong>
      </div>
      <div class="stat-card">
        <small>Usuários Cadastrados</small>
        <strong id="relatorio-qtd-usuarios" class="texto-sucesso">0</strong>
      </div>
      <div class="stat-card">
        <small>Total de Mensagens</small>
        <strong id="relatorio-qtd-mensagens" class="texto-destaque">0</strong>
      </div>
      <div class="stat-card">
        <small>Tamanho Usado</small>
        <strong id="relatorio-tamanho" class="texto-alerta">0 KB</strong>
      </div>
    </div>

    <!-- TABELA DE DADOS -->
    <h3>Chaves Armazenadas</h3>
    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Chave (Key)</th>
            <th>Conteúdo (Value)</th>
          </tr>
        </thead>
        <tbody id="tabela-localStorage">
          <!-- Gerado dinamicamente via JS -->
        </tbody>
      </table>
    </div>

    <!-- BOTÃO DE REMOÇÃO DA BASE -->
    <div class="acoes-container">
      <button onclick="limparTudo()" class="btn-danger">
        🗑️ Limpar Todo o LocalStorage
      </button>
    </div>
  </main>

  <script src="/js/relatorio.js"></script>
</body>
</html>
