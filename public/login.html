<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar no Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;display=block">
</head>

<body class="bg-black">
  <main class="auth-layout d-flex justify-content-center align-items-center px-3">
    <form id="form-login" class="login-card rounded-4 p-4 w-100">
  <img class="marca-logo-login" src="/img/icon-chat-conversar.png" alt="Chat Conversar" >

  <h1 class="h2 text-center mb-4 fw-bold">Entrar no Chat</h1>


      <p id="msg-sucesso" class="text-info" role="status" style="display: none;">
        Conta criada. Entre com seu nome e senha.
      </p>

      <p class="small text-secondary">Demonstração acadêmica. Use um nome e uma senha fictícios.</p>

      <div class="mb-3">
        <label for="username" class="form-label">Nome de usuário</label>
        <input id="username" class="form-control" autocomplete="username" required maxlength="40">
      </div>

      <div>
        <label for="senha" class="form-label">Senha</label>
      </div>
      <div class="senha-wrapper">
        <input id="senha" type="password" class="form-control" autocomplete="new-password" required minlength="8"
          maxlength="128" aria-describedby="requisito-senha">
        <button type="button" class="btn-olho" id="btn-olho" aria-label="Mostrar senha"><span class="ui-icon" aria-hidden="true">visibility</span></button>
      </div>

      <p id="msg-erro" class="text-warning" role="alert" style="display: none;"></p>

      <button type="submit" class="btn btn-primary w-100">Entrar</button>

      <a class="d-block text-center link-light mt-3" href="/cadastro.html">
        Criar uma conta
      </a>
      <a class="d-block text-center link-light" href="/sobre.html">Sobre o site</a>
    </form>
  </main>

  <script src="/js/contas.js"></script>
  <script src="/js/login.js"></script>
</body>

</html>
